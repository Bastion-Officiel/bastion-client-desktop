<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASTION — Reconnexion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1e1f22;
            color: #dbdee1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .reconnect-card {
            background: #2b2d31;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 36px 32px;
            width: 380px;
            text-align: center;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.96); }
            50% { transform: scale(1.04); }
            100% { transform: scale(0.96); }
        }
        h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            color: #949ba4;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn-retry {
            background: #5865F2;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s ease;
        }
        .btn-retry:hover {
            background: #4752C4;
        }
    </style>
</head>
<body>
    <div class="reconnect-card">
        <img src="assets/icon.png" class="logo" alt="BASTION">
        <h2>Reconnexion à BASTION</h2>
        <p>Le moteur local redémarre ses services en arrière-plan...</p>
        <button class="btn-retry" onclick="location.href='http://127.0.0.1:8080/app'">Réessayer</button>
    </div>

    <script>
        // Tentative de reconnexion automatique toutes les 2 secondes
        setInterval(() => {
            fetch('http://127.0.0.1:8080/app', { method: 'HEAD', cache: 'no-store' })
                .then(() => { location.href = 'http://127.0.0.1:8080/app'; })
                .catch(() => {});
        }, 2000);
    </script>
</body>
</html>
