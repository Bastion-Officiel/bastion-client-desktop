<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASTION</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1e1f22;
            color: #dbdee1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-app-region: drag;
        }
        .logo-wrap {
            position: relative;
            margin-bottom: 24px;
        }
        .logo-img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            animation: pulse 2.2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(88, 101, 242, 0.5); }
            50% { transform: scale(1.02); box-shadow: 0 0 20px 8px rgba(88, 101, 242, 0.25); }
            100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(88, 101, 242, 0.5); }
        }
        .title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .status {
            font-size: 13px;
            color: #949ba4;
            font-weight: 500;
            min-height: 20px;
            text-align: center;
        }
        .progress-bar-wrap {
            width: 200px;
            height: 4px;
            background: #2b2d31;
            border-radius: 2px;
            margin-top: 18px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #5865F2;
            border-radius: 2px;
            transition: width 0.2s ease;
        }
        .progress-bar.indeterminate {
            width: 40%;
            animation: loadingIndeterminate 1.5s infinite ease-in-out;
        }
        @keyframes loadingIndeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
    </style>
</head>
<body>
    <div class="logo-wrap">
        <img src="assets/icon.png" class="logo-img" alt="BASTION">
    </div>
    <div class="title">BASTION</div>
    <div class="status" id="status-text">Recherche de mises à jour...</div>
    <div class="progress-bar-wrap">
        <div class="progress-bar indeterminate" id="progress-bar"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        ipcRenderer.on('updater-message', (event, { text, progress, indeterminate }) => {
            if (text) {
                document.getElementById('status-text').innerText = text;
            }
            const bar = document.getElementById('progress-bar');
            if (indeterminate) {
                bar.classList.add('indeterminate');
                bar.style.width = '40%';
            } else if (typeof progress === 'number') {
                bar.classList.remove('indeterminate');
                bar.style.width = Math.min(100, Math.max(0, progress)) + '%';
            }
        });
    </script>
</body>
</html>
